<!DOCTYPE html>
<html lang="es">
<head>

    <title>Portal Analítico - SuperStore</title>
    <style>
        body {

            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 40px;
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #1f2a44;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<header>
    <h1>Portal Analítico – SuperStore</h1>

<div class="container">

        <h2>Ventas y Beneficio por Categoría</h2>
        <iframe src="" style="border:none;width:100%;height:100%;"></iframe>
    </div>

    <div class="card">
