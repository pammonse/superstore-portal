<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Analítico - SuperStore</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        header {
            background-color: #1f2a44;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 40px;
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #1f2a44;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
    
    <script
        crossorigin="anonymous"
        type="application/javascript"
        src="https://cdn.jsdelivr.net/npm/@qlik/embed-web-components@1/dist/index.min.js"
        data-host="https://l676lvg3emfvcq2.us.qlikcloud.com"
        data-auth-type="webintegration"
        data-web-integration-id="deldUOnOAI1lAtiqRYAfZbG0_OkzkJHs"
    ></script>
    
</head>

<body>

<header>
    <h1>Portal Analítico – SuperStore</h1>
    <p>Integración de dashboards Qlik en entorno web</p>
</header>

<div class="container">

    <div class="card">
        <h2>Ventas y Beneficio por Categoría</h2>
        <qlik-embed
            ui="analytics/chart"
            app-id="f6b21137-f398-4584-a088-d3d467c7a899"
            object-id="QqJjE"
            theme="Sense Horizonte">
        </qlik-embed>
    </div>

    <div class="card">
        <h2>Evolución Temporal de Ventas</h2>
        <qlik-embed
            ui="analytics/chart"
            app-id="f6b21137-f398-4584-a088-d3d467c7a899"
            object-id="BpnYa"
            theme="Sense Horizonte">
        </qlik-embed>

</div>

<footer>
    Proyecto Hackatón – Pamela Luna Sepúlveda - Febrero 2026
</footer>

</body>
</html>
